[project]
name = "lightning-epoch-progress-bar"
version = "0.1.0"
description = "Rich epoch-level progress bar callback for PyTorch Lightning, with elapsed and remaining time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Gomes" }]
requires-python = ">=3.10"
dependencies = [
    "pytorch_lightning>=2.0,<3",
    "rich>=13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "mypy>=2.1",
]

[project.urls]
Homepage = "https://github.com/eliasgomes/lightning-epoch-progress-bar"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightning_epoch_progress_bar = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
